<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>doom-etch · Live rig</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
<body><div id="status" role="status">Loading the rig…</div>
<output id="physical-mode" hidden>Physical · 1×</output>
<pre id="play-evidence" hidden></pre>
<script>
function bootError(message){
  if(document.documentElement.dataset.failed)return;document.documentElement.dataset.failed='true';
  const status=document.getElementById('status');status.hidden=false;status.className='error';status.textContent=message;
  document.getElementById('play-evidence').textContent=JSON.stringify({state:'error',error:message});
  window.webkit?.messageHandlers?.presentation?.postMessage({type:'error',message});
}
window.addEventListener('error',event=>bootError(event.message||'Could not load '+(event.target.src||event.target.href||'page resource')),true);
window.addEventListener('unhandledrejection',event=>bootError(String(event.reason)));
</script>
<script type="module" src="game.js"></script></body></html>
